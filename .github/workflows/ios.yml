name: iOS Build & Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: Simulator auswählen
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, devices in sorted(data.items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          ')
          echo "Simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Bauen und testen
        run: |
          set -o pipefail
          xcodebuild test \
            -project KarteiKarten.xcodeproj \
            -scheme KarteiKarten \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning:|Test Case|Executed|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log
